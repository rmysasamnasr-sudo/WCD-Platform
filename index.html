<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCD Platform | المنصة العالمية</title>
    <!-- استدعاء خطوط أنيقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px;
        }
        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        header h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            margin-bottom: 10px;
        }
        header p {
            font-size: 1.2rem;
            color: #94a3b8;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .card h2 {
            margin-bottom: 20px;
            color: #38bdf8;
            font-size: 1.5rem;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: bold;
        }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 1rem;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: #38bdf8;
            outline: none;
        }
        button {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .project-card {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }
        .project-card:hover {
            border-color: #38bdf8;
            transform: translateY(-5px);
        }
        .project-card h3 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .project-card p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 15px;
        }
        .project-card a {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .project-card a:hover {
            background: #0369a1;
        }
        .author {
            font-size: 0.8rem;
            color: #64748b;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>WCD Platform</h1>
            <p>المنصة العالمية المفتوحة لنشر التطبيقات، الألعاب، والقصص للجميع</p>
        </header>

        <!-- قسم النشر -->
        <div class="card">
            <h2>✨ انشر مشروعك الجديد للعالم</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label>اسمك أو اسم الفريق:</label>
                    <input type="text" id="authorName" required placeholder="اكتب اسمك...">
                </div>
                <div class="form-group">
                    <label>عنوان المشروع (تطبيق، لعبة، قصة، برنامج):</label>
                    <input type="text" id="projectTitle" required placeholder="مثلاً: لعبة مغامرات الفضاء">
                </div>
                <div class="form-group">
                    <label>وصف مختصر:</label>
                    <textarea id="projectDesc" rows="3" required placeholder="اشرح مشروعك في سطرين..."></textarea>
                </div>
                <div class="form-group">
                    <label>رابط التحميل أو المعاينة (GitHub, Drive, رابط الموقع):</label>
                    <input type="url" id="projectLink" required placeholder="https://...">
                </div>
                <button type="submit">نشر للكل فوراً 🚀</button>
            </form>
        </div>

        <!-- قسم العرض -->
        <div class="card">
            <h2>🌍 أحدث إضافات المجتمع العالمي</h2>
            <div id="projectsContainer" class="projects-grid">
                <p style="color: #94a3b8;">جاري تحميل المشاريع...</p>
            </div>
        </div>
    </div>

    <!-- كود ربط وفيربيز والتشغيل -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
          apiKey: "AIzaSyCpauGRQPVYvfTyIZJJ0Ibo6jgoz7l3bzI",
          authDomain: "wcd-platform.firebaseapp.com",
          projectId: "wcd-platform",
          storageBucket: "wcd-platform.firebasestorage.app",
          messagingSenderId: "812735705048",
          appId: "1:812735705048:web:7aceb0aaeab38fd0b1ccad",
          measurementId: "G-7LTY3DW4LN"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const form = document.getElementById('projectForm');
        const container = document.getElementById('projectsContainer');

        // حفظ المشروع في قاعدة البيانات
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const author = document.getElementById('authorName').value;
            const title = document.getElementById('projectTitle').value;
            const desc = document.getElementById('projectDesc').value;
            const link = document.getElementById('projectLink').value;

            try {
                await addDoc(collection(db, "projects"), {
                    author: author,
                    title: title,
                    description: desc,
                    link: link,
                    createdAt: new Date()
                });
                alert('تم نشر مشروعك بنجاح وأصبح مرئياً لكل العالم! 🌟');
                form.reset();
                loadProjects();
            } catch (error) {
                console.error("خطأ في النشر: ", error);
                alert('حدث خطأ أثناء النشر، تأكد من اتصال الإنترنت.');
            }
        });

        // جلب وعرض المشاريع لكل الزوار
        async function loadProjects() {
            container.innerHTML = '<p style="color: #94a3b8;">جاري تحميل المشاريع...</p>';
            try {
                const q = query(collection(db, "projects"), orderBy("createdAt", "desc"));
                const querySnapshot = await getDocs(q);
                
                if(querySnapshot.empty) {
                    container.innerHTML = '<p style="color: #94a3b8;">لا توجد مشاريع منشورة حتى الآن. كن أول المبدعين!</p>';
                    return;
                }

                container.innerHTML = '';
                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.innerHTML = `
                        <h3>${escapeHtml(p.title)}</h3>
                        <p>${escapeHtml(p.description)}</p>
                        <a href="${escapeHtml(p.link)}" target="_blank">زيارة / تحميل المشروع 🔗</a>
                        <div class="author">بواسطة: ${escapeHtml(p.author)}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ في الجلب: ", error);
                container.innerHTML = '<p style="color: #ef4444;">تعذر تحميل المشاريع حالياً.</p>';
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // تشغيل التحميل أول ما الصفحة تفتح
        loadProjects();
    </script>
</body>
</html>
